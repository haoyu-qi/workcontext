name: portable-services
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: '3.9'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: workcontext selfcheck
      - run: python -m unittest discover -s tests -p test_skills.py -v
      - run: python -m unittest discover -s tests -p test_sources.py -v
      - run: python -m unittest discover -s tests -p test_runtime.py -v
      - run: python -m unittest discover -s tests -p test_execution_core.py -v
      - run: python -m unittest discover -s tests -p test_execution_worker.py -v
